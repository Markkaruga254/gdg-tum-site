name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Dependency audit (informational)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  ai-service:
    name: Gemini AI service tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install AI service dependencies
        run: npm install --no-audit --no-fund
      - name: Run service tests
        run: npm test

  firestore-rules:
    name: Firestore authorization tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.35.0
      - name: Test Firestore security rules
        run: npm run test:rules
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_PROJECT_ID: demo-gdg-tum-site

  browser-e2e:
    name: Functional browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.35.0
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run functional E2E tests
        run: npm run test:e2e:ci

  production-build:
    name: Production build and export smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build static export
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-gdg-tum-site
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1:web:ci-placeholder"
        run: npm run build
      - name: Verify every exported page and Firebase Hosting config
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const routes = [
            "index", "events", "tracks", "gallery", "blog", "leads",
            "writeups", "labs", "login", "admin", "dashboard",
            "event", "track", "writeup", "lead"
          ];
          const missing = routes
            .map((route) => `out/${route}.html`)
            .filter((file) => !fs.existsSync(file) || fs.statSync(file).size === 0);
          if (missing.length) {
            console.error("Missing or empty exported route files:", missing.join(", "));
            process.exit(1);
          }
          const config = JSON.parse(fs.readFileSync("firebase.json", "utf8"));
          if (config.hosting?.public !== "out") {
            console.error("Firebase Hosting must publish the generated out/ directory");
            process.exit(1);
          }
          if (config.hosting?.cleanUrls !== true) {
            console.error("Firebase Hosting must enable cleanUrls for extensionless Next.js export routes");
            process.exit(1);
          }
          console.log(`Verified ${routes.length} exported page files and Firebase clean URL configuration.`);
          NODE

  gate:
    name: Required CI gate
    if: always()
    needs:
      - quality
      - firestore-rules
      - browser-e2e
      - production-build
      - ai-service
    runs-on: ubuntu-latest
    steps:
      - name: Require all core validation jobs
        env:
          QUALITY: ${{ needs.quality.result }}
          FIRESTORE_RULES: ${{ needs.firestore-rules.result }}
          BROWSER_E2E: ${{ needs.browser-e2e.result }}
          PRODUCTION_BUILD: ${{ needs.production-build.result }}
          AI_SERVICE: ${{ needs.ai-service.result }}
        run: |
          set -eu
          failed=0
          for check in QUALITY FIRESTORE_RULES BROWSER_E2E PRODUCTION_BUILD AI_SERVICE; do
            result="${!check}"
            printf '%-20s %s\n' "$check" "$result"
            if [ "$result" != "success" ]; then
              echo "::error::$check did not succeed (result: $result)"
              failed=1
            fi
          done
          exit "$failed"

  deploy:
    name: Deploy to Firebase
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Validate production Firebase configuration
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -eu
          missing=0
          for name in \
            NEXT_PUBLIC_FIREBASE_API_KEY \
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
            NEXT_PUBLIC_FIREBASE_PROJECT_ID \
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET \
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            NEXT_PUBLIC_FIREBASE_APP_ID \
            FIREBASE_SERVICE_ACCOUNT
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required production environment secret is missing or empty: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Configure the missing secrets in the GitHub production environment."
            exit 1
          fi
          if [ "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" != "gdg-tum-site" ]; then
            echo "::error::NEXT_PUBLIC_FIREBASE_PROJECT_ID must be gdg-tum-site for production."
            exit 1
          fi
          node <<'NODE'
          let serviceAccount;
          try {
            serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          } catch {
            console.error("::error::FIREBASE_SERVICE_ACCOUNT must contain valid service-account JSON.");
            process.exit(1);
          }
          if (
            serviceAccount.project_id !== "gdg-tum-site" ||
            !serviceAccount.client_email ||
            !serviceAccount.private_key
          ) {
            console.error("::error::FIREBASE_SERVICE_ACCOUNT must be a complete service account for gdg-tum-site.");
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Production build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: npm run build

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.35.0

      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase deploy --only hosting,firestore:rules,firestore:indexes --project gdg-tum-site --non-interactive
